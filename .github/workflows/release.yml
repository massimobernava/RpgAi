name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v0.1.0'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # ── Linux ──────────────────────────────────────────────────────────────
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libluajit-5.1-dev \
            libcurl4-openssl-dev \
            libasio-dev \
            dpkg-dev \
            imagemagick

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Package (Linux .deb)
        if: runner.os == 'Linux'
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION_NUM="${VERSION#v}"
          DEB=rpgai_${VERSION_NUM}_amd64

          # Directories
          mkdir -p $DEB/usr/local/bin
          mkdir -p $DEB/usr/local/share/rpgai/scripts
          mkdir -p $DEB/usr/local/share/rpgai/servers/t2i
          mkdir -p $DEB/usr/local/share/rpgai/servers/faceswap
          mkdir -p $DEB/usr/local/share/rpgai/servers/qwen
          mkdir -p $DEB/usr/share/applications
          mkdir -p $DEB/usr/share/icons/hicolor/16x16/apps
          mkdir -p $DEB/usr/share/icons/hicolor/32x32/apps
          mkdir -p $DEB/usr/share/icons/hicolor/48x48/apps
          mkdir -p $DEB/usr/share/icons/hicolor/128x128/apps
          mkdir -p $DEB/usr/share/icons/hicolor/256x256/apps
          mkdir -p $DEB/DEBIAN

          # Executable, launcher and data
          cp build/rpgai $DEB/usr/local/bin/
          cp installer/linux/rpgai-web $DEB/usr/local/bin/
          chmod +x $DEB/usr/local/bin/rpgai-web
          cp -r scripts/.         $DEB/usr/local/share/rpgai/scripts/
          cp -r t2i_locale/.      $DEB/usr/local/share/rpgai/servers/t2i/
          cp -r faceswap_locale/. $DEB/usr/local/share/rpgai/servers/faceswap/
          cp -r qwen_locale/.     $DEB/usr/local/share/rpgai/servers/qwen/
          cp installer/macos/getting_started.html \
             $DEB/usr/local/share/rpgai/

          # Icons (from source PNG if present, else skip)
          if [ -f installer/rpgai-1024.png ]; then
            for SIZE in 16 32 48 128 256; do
              convert installer/rpgai-1024.png \
                -resize ${SIZE}x${SIZE} \
                $DEB/usr/share/icons/hicolor/${SIZE}x${SIZE}/apps/rpgai.png
            done
          fi

          # .desktop file
          cp installer/linux/rpgai.desktop $DEB/usr/share/applications/

          # control
          cat > $DEB/DEBIAN/control << EOF
          Package: rpgai
          Version: ${VERSION_NUM}
          Architecture: amd64
          Maintainer: RpgAi <noreply@rpgai.local>
          Description: RpgAi interactive AI story engine
          EOF

          # postinst
          cat > $DEB/DEBIAN/postinst << 'POSTINST'
          #!/bin/bash
          set -e
          REAL_USER="${SUDO_USER:-$USER}"
          if [ -z "$REAL_USER" ] || [ "$REAL_USER" = "root" ]; then exit 0; fi
          USER_HOME=$(eval echo "~$REAL_USER")
          DOCS="$USER_HOME/RpgAi"
          SRC="/usr/local/share/rpgai"
          mkdir -p "$DOCS/scripts/lib" "$DOCS/servers" "$DOCS/output" "$DOCS/saves"
          [ ! -f "$DOCS/scripts/fantasy_demo.lua" ] && cp -rn "$SRC/scripts/." "$DOCS/scripts/" 2>/dev/null || true
          [ ! -f "$DOCS/servers/t2i/server.py" ]   && cp -rn "$SRC/servers/." "$DOCS/servers/" 2>/dev/null || true
          chown -R "$REAL_USER" "$DOCS"
          update-icon-caches /usr/share/icons/hicolor 2>/dev/null || true
          exit 0
          POSTINST
          chmod 755 $DEB/DEBIAN/postinst

          dpkg-deb --build $DEB
          mv ${DEB}.deb rpgai-linux.deb

      - name: Upload (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: rpgai-linux
          path: rpgai-linux.deb

      # ── macOS ──────────────────────────────────────────────────────────────
      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install luajit curl asio

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Generate .icns (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ ! -f installer/rpgai-1024.png ]; then
            echo "No icon found at installer/rpgai-1024.png — skipping .icns generation"
            exit 0
          fi
          ICONSET=installer/macos/rpgai.iconset
          mkdir -p "$ICONSET"
          sips -z 16   16   installer/rpgai-1024.png --out "$ICONSET/icon_16x16.png"
          sips -z 32   32   installer/rpgai-1024.png --out "$ICONSET/icon_16x16@2x.png"
          sips -z 32   32   installer/rpgai-1024.png --out "$ICONSET/icon_32x32.png"
          sips -z 64   64   installer/rpgai-1024.png --out "$ICONSET/icon_32x32@2x.png"
          sips -z 128  128  installer/rpgai-1024.png --out "$ICONSET/icon_128x128.png"
          sips -z 256  256  installer/rpgai-1024.png --out "$ICONSET/icon_128x128@2x.png"
          sips -z 256  256  installer/rpgai-1024.png --out "$ICONSET/icon_256x256.png"
          sips -z 512  512  installer/rpgai-1024.png --out "$ICONSET/icon_256x256@2x.png"
          sips -z 512  512  installer/rpgai-1024.png --out "$ICONSET/icon_512x512.png"
          sips -z 1024 1024 installer/rpgai-1024.png --out "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o installer/macos/rpgai.icns
          echo "icns generated"

      - name: Package (macOS .pkg)
        if: runner.os == 'macOS'
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION_NUM="${VERSION#v}"

          mkdir -p pkg_payload/usr/local/bin
          mkdir -p pkg_payload/usr/local/share/rpgai/scripts
          mkdir -p pkg_payload/usr/local/share/rpgai/servers/t2i
          mkdir -p pkg_payload/usr/local/share/rpgai/servers/faceswap
          mkdir -p pkg_payload/usr/local/share/rpgai/servers/qwen

          cp build/rpgai pkg_payload/usr/local/bin/
          cp -r scripts/.         pkg_payload/usr/local/share/rpgai/scripts/
          cp -r t2i_locale/.      pkg_payload/usr/local/share/rpgai/servers/t2i/
          cp -r faceswap_locale/. pkg_payload/usr/local/share/rpgai/servers/faceswap/
          cp -r qwen_locale/.     pkg_payload/usr/local/share/rpgai/servers/qwen/
          cp installer/macos/getting_started.html \
             pkg_payload/usr/local/share/rpgai/

          # Compile Swift menu bar launcher
          swiftc -O -o RpgAiMenuBar \
            installer/macos/RpgAiMenuBar.swift \
            -framework AppKit

          # .app bundle → /Applications/ (assembled from flat source files)
          APP=pkg_payload/Applications/RpgAi.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp installer/macos/Info.plist "$APP/Contents/"
          cp RpgAiMenuBar               "$APP/Contents/MacOS/RpgAi"
          chmod +x "$APP/Contents/MacOS/RpgAi"
          [ -f installer/macos/rpgai.icns ] && \
            cp installer/macos/rpgai.icns "$APP/Contents/Resources/rpgai.icns"

          pkgbuild \
            --root pkg_payload \
            --install-location / \
            --scripts installer/macos/scripts \
            --identifier com.rpgai.app \
            --version "$VERSION_NUM" \
            RpgAi.pkg

          productbuild \
            --distribution installer/macos/distribution.xml \
            --package-path . \
            --resources installer/macos \
            rpgai-macos.pkg

      - name: Upload (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: rpgai-macos
          path: rpgai-macos.pkg

      # ── Windows (MSYS2 build + NSIS package) ───────────────────────────────
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-luajit
            mingw-w64-x86_64-curl-winssl
            mingw-w64-x86_64-asio

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install nsis --yes --no-progress

      - name: Package (Windows .exe installer)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $VERSION = "${{ github.event.inputs.version }}".TrimStart("v")

          # Stage files next to the NSIS script
          Copy-Item build\rpgai.exe                    installer\windows\
          Copy-Item -Recurse scripts               installer\windows\scripts         -Force
          Copy-Item -Recurse t2i_locale            installer\windows\t2i_locale      -Force
          Copy-Item -Recurse faceswap_locale       installer\windows\faceswap_locale -Force
          Copy-Item -Recurse qwen_locale           installer\windows\qwen_locale     -Force
          Copy-Item installer\macos\getting_started.html installer\windows\          -Force
          Copy-Item LICENSE                        installer\windows\                -Force

          # Patch version
          (Get-Content installer\windows\setup.nsi) `
            -replace 'OutFile "RpgAi-Setup.exe"', "OutFile `"RpgAi-$VERSION-Setup.exe`"" `
            -replace 'RPGAI_VERSION', $VERSION |
            Set-Content installer\windows\setup.nsi

          & "C:\Program Files (x86)\NSIS\makensis.exe" installer\windows\setup.nsi
          Move-Item "installer\windows\RpgAi-$VERSION-Setup.exe" "rpgai-windows-setup.exe"

      - name: Upload (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: rpgai-windows
          path: rpgai-windows-setup.exe

  # ── Create draft release ──────────────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create tag and draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION" HEAD
          git push origin "$VERSION"
          gh release create "$VERSION" \
            --title "RpgAi $VERSION" \
            --draft \
            --generate-notes \
            artifacts/rpgai-linux/rpgai-linux.deb \
            artifacts/rpgai-macos/rpgai-macos.pkg \
            artifacts/rpgai-windows/rpgai-windows-setup.exe
